[project]
name = "swiss-film"
version = "0.1.0"
description = "Swiss Film — Kino-Datenjournalismus (BFS PX + P4)"
requires-python = ">=3.11"
authors = [{ name = "datenpunk-ch", email = "datenpunk.ch@gmail.com" }]
dependencies = []

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.environments]
default = { solve-group = "default" }

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
numpy = ">=1.24"
pandas = ">=2.0"
matplotlib = ">=3.7"
scipy = ">=1.11"
pymc = ">=5.10"
arviz = ">=0.17"

[tool.pixi.tasks]
analyze = { cmd = "python python/run_analyses.py", description = "Kino-Analysen (PX+P4) → analysis.html" }
build-analysis = { cmd = "node scripts/build_analysis_page.mjs", description = "SVG-Fallback ohne PyMC (Node)" }
build-unified = { cmd = "node scripts/build_unified.mjs", description = "data/unified.json aus Rohdaten" }
bundle-ui = { cmd = "node scripts/bundle_unified_ui.mjs", description = "React-Dashboard bündeln" }
