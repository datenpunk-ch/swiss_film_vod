<!doctype html>
<html lang="de">
  <head>
    <script>
      (function () {
        try {
          var p = new URLSearchParams(window.location.search);
          var v = (p.get("embed") || "").toLowerCase();
          if (v === "1" || v === "true" || v === "yes") {
            document.documentElement.classList.add("is-embed");
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swiss Film — Daten-Explorer</title>
    <meta
      name="description"
      content="Deskriptive Statistiken und Datenbeschreibungen zu BFS VoD-, Kino- und Filmangebotsdaten."
    />
    <link rel="stylesheet" href="./assets/fonts.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="page-explore page-dataset-stats page-data-explorer">
    <div class="wrap">
      <header class="page-head">
        <h1>Daten-Explorer</h1>
        <p id="pageIntro" class="page-intro-lead">
          Deskriptive Statistiken zu den Rohdaten in <code>data/raw/</code>.
        </p>
        <div class="controls controls-explorer">
          <div class="control-group">
            <label for="datasetSelect">Datensatz</label>
            <select id="datasetSelect" aria-label="Datensatz wählen"></select>
          </div>
        </div>
      </header>

      <section class="panel" aria-labelledby="data-heading">
        <div class="panel-label" id="data-heading">Datengrundlage</div>
        <div id="datasetInfo"></div>
      </section>

      <div class="controls controls-view" id="viewControls" hidden>
        <div class="control-group" id="yearControl">
          <label for="yearSelect">Berichtsjahr</label>
          <select id="yearSelect" aria-label="Berichtsjahr filtern"></select>
        </div>
        <div id="statOptions" class="controls-stat-options" aria-label="Statistik-Optionen"></div>
      </div>

      <div id="explorerPanels"></div>
    </div>

    <footer class="site-footer">
      Swiss Film · <a href="./index.html">Artikel</a>
    </footer>

    <script type="module">
      import { initDataExplorer } from "./assets/data-explorer.js";
      initDataExplorer();
    </script>
  </body>
</html>
