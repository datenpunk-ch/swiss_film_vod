<!doctype html>
<html lang="de">
  <head>
    <script>
      (function () {
        try {
          var p = new URLSearchParams(window.location.search);
          var v = (p.get("embed") || "").toLowerCase();
          if (v === "1" || v === "true" || v === "yes") {
            document.documentElement.classList.add("is-embed");
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swiss Film — Schweizer Film gewinnt im Kino</title>
    <meta
      name="description"
      content="Kurzstory: CH-Kinoanteil steigt nach 2022, Erfolg in Fiktion und Dokumentar, Programm-Lücke schrumpft — Bayesianische BFS-Auswertung."
    />
    <link rel="stylesheet" href="./assets/fonts.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="page-article">
    <a class="skip-link" href="#content">Zum Inhalt</a>
    <div class="progress-bar" id="progress"></div>

    <header
      class="hero"
      aria-label="Swiss Film Artikel — Kopf"
      data-src="./content/article.md"
      data-part="hero"
    ></header>

    <main id="content" data-src="./content/article.md" data-part="body"></main>

    <footer class="site-footer site-footer-chrome reveal">
      Swiss Film<span class="site-footer-subnav" aria-label="Weitere Seiten dieser Site">
        · <a href="./unified.html">Übersicht</a> · <a href="./analysis.html">Analysen</a></span
      >
    </footer>

    <script src="./assets/markdown-content.js"></script>
    <script>
      window.__contentReady = (async function () {
        const MC = window.MarkdownContent;
        const nodes = Array.from(document.querySelectorAll("[data-src]"));
        if (!nodes.length || !MC) return;

        function mdToHtmlArticle(md) {
          return MC.mdToHtml(md)
            .replace(/<h2>/g, '<h2 class="reveal">')
            .replace(/<h3>/g, '<h3 class="reveal">')
            .replace(/<p class="analysis-prose">/g, '<p class="reveal">')
            .replace(/<ul>/g, '<ul class="reveal">');
        }

        async function loadInto(node, cache) {
          const src = node.getAttribute("data-src");
          if (!src) return;
          const part = (node.getAttribute("data-part") || "").trim();
          const txt = await MC.fetchTextCached(cache, src);
          if (src.toLowerCase().endsWith(".md")) {
            const parts = MC.splitParts(txt);
            const chunk =
              parts && part && Object.prototype.hasOwnProperty.call(parts, part)
                ? parts[part]
                : txt;
            node.innerHTML = mdToHtmlArticle(chunk);
          } else {
            node.innerHTML = txt;
          }
        }

        try {
          const cache = new Map();
          for (const node of nodes) {
            await loadInto(node, cache);
          }
        } catch (e) {
          console.error(e);
          const main = document.getElementById("content");
          if (main) {
            main.innerHTML =
              "<section><div class='container'><div class='note-box'>" +
              "<div class='note-box-label'>Hinweis</div>" +
              "<p>Der Artikel konnte nicht geladen werden. Direkt öffnen: <a href='./content/article.md'>article.md</a>.</p>" +
              "</div></div></section>";
          }
        }
      })();
    </script>
    <script src="./assets/article-page.js"></script>
    <script>
      (async function () {
        await (window.__articleInjectReady || window.__contentReady || Promise.resolve());
        const progress = document.getElementById("progress");
        if (!progress) return;
        function tick() {
          const h = document.documentElement;
          const sh = h.scrollHeight - h.clientHeight;
          const pct = sh > 0 ? (h.scrollTop / sh) * 100 : 0;
          progress.style.width = pct + "%";
        }
        window.addEventListener("scroll", tick, { passive: true });
        window.addEventListener("resize", tick);
        tick();
      })();
    </script>
    <script>
      (async function () {
        await (window.__articleInjectReady || window.__contentReady || Promise.resolve());
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((e) => {
              if (e.isIntersecting) {
                e.target.classList.add("visible");
                observer.unobserve(e.target);
              }
            });
          },
          { threshold: 0.12 }
        );
        document.querySelectorAll(".reveal").forEach((el) => observer.observe(el));
      })();
    </script>
  </body>
</html>
